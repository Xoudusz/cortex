[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-local"
dynamic = ["version"]
description = "Local semantic search MCP server — notes + code, embedded Qdrant, fastembed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "qdrant-client>=1.17.0",
    "fastembed>=0.4.0",
    "click>=8.0.0",
    "networkx>=3.0",
    "watchdog>=3.0",
    "tqdm>=4.0",
    "rich>=13",
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-kotlin",
    "tree-sitter-c-sharp",
    "tree-sitter-gdscript",
]

[project.scripts]
cortex = "cortex.cli:cli"

[project.entry-points."mcp.servers"]
cortex = "cortex.mcp_server:run"

[tool.hatch.version]
source = "regex"
path = "../VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.hatch.build.targets.wheel]
packages = ["cortex"]

# core/ lives at repo root and is shared with the server; hatch_build.py bundles it as
# cortex/core. (A symlink broke git installs on Windows: core.symlinks=false checks it out
# as a text file.)
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
